name: Deploy configure-ntpd Ansible Playbook
on:
  push:
    branches:
      - main
    paths:
      - 'roles/configure_ntpd/**'
      - 'configure_ntpd.yml'
      - 'inventory/group_vars/pihole/ntp.yml'

jobs:
  run-configure-ntpd:
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Ansible Playbook syntax
        run: |
          ansible-playbook configure_ntpd.yml --syntax-check

      - name: Run Ansible Playbook
        run: |
          ansible-playbook configure_ntpd.yml

      - name: Cleanup workspace
        if: always()
        run: |
          echo "Cleanup workspace..."
          rm -rf "${{ github.workspace }}"/*
          rm -rf "${{ github.workspace }}"/.[!.]*
