name: Deploy configure-ufw Ansible Playbook
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'roles/configure_ufw/tasks/**'
      - 'configure_ufw.yml'

jobs:
  run-configure-ufw:
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Ansible Playbook syntax
        run: |
          ansible-playbook configure_ufw.yml --syntax-check

      - name: Run Ansible Playbook
        run: |
          ansible-playbook configure_ufw.yml

      - name: Cleanup workspace
        if: always()
        run: |
          echo "Cleanup workspace..."
          rm -rf "${{ github.workspace }}"/*
          rm -rf "${{ github.workspace }}"/.[!.]*
