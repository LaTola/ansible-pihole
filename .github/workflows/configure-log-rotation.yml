name: Deploy configure-log-rotation Ansible Playbook
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'roles/configure_log_rotation/**'
      - 'inventory/group_vars/pihole/journalctl.yml'
      - 'configure_log_rotation.yml'

jobs:
  run-configure-log-rotation:
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Ansible Playbook syntax
        run: |
          ansible-playbook configure_log_rotation.yml --syntax-check

      - name: Run Ansible Playbook
        run: |
          ansible-playbook configure_log_rotation.yml

      - name: Cleanup workspace
        if: always()
        run: |
          echo "Cleanup workspace..."
          rm -rf "${{ github.workspace }}"/*
          rm -rf "${{ github.workspace }}"/.[!.]*
