---
- name: Check if Pi-hole is already installed
  ansible.builtin.command:
    argv:
      - dpkg-query
      - -W
      - pihole-meta
  failed_when: false
  changed_when: false
  register: pihole_check

- name: Install Pi-hole on ARMv6 Debian system
  become: true
  become_method: ansible.builtin.sudo
  when: pihole_check.rc != 0
  block:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install prerequisite packages
      ansible.builtin.apt:
        name:
          - curl
          - git
          - netcat-openbsd
          - sqlite3
          - dnsutils
        state: present

    - name: Download the Pi-hole automated installer
      ansible.builtin.get_url:
        url: https://install.pi-hole.net
        dest: /tmp/pi-hole-installer.sh
        mode: "0755"

    - name: Run the Pi-hole installer in non-interactive mode
      ansible.builtin.shell: |
        /tmp/pi-hole-installer.sh --unattended --web-password "{{ pihole_default_webpassword }}"
      environment:
        TERM: xterm-256color
      changed_when: true
      no_log: true

    - name: Ensure the pihole-FTL service is running and enabled
      ansible.builtin.systemd:
        name: pihole-FTL
        state: started
        enabled: true

    - name: Clean up installer script
      ansible.builtin.file:
        path: /tmp/pi-hole-installer.sh
        state: absent
