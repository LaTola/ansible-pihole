---
- name: Check if Unbound is already installed
  ansible.builtin.command: dpkg-query -W unbound
  register: unbound_installed
  failed_when: false
  changed_when: false
  check_mode: false

- name: Display installation status
  ansible.builtin.debug:
    msg: "Unbound is {{ 'already installed' if unbound_installed.rc == 0 else 'not installed, will install now' }}"

- name: Install Unbound and dependencies
  when: unbound_installed.rc != 0
  become: true
  become_method: ansible.builtin.sudo
  block:
    - name: Update apt cache (if needed)
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install Unbound and dependencies (if not installed)
      ansible.builtin.apt:
        name:
          - unbound
          - dnsutils
        state: present

    - name: Create Unbound configuration directory (if not exists)
      ansible.builtin.file:
        path: "{{ unbound_daemon_config_dir | default('/etc/unbound/unbound.conf.d') }}"
        state: directory
        owner: "{{ unbound_user }}"
        group: "{{ unbound_group }}"
        mode: "0755"

    - name: Enable Unbound service (if not already enabled)
      ansible.builtin.systemd:
        name: unbound
        enabled: true
        daemon_reload: true
