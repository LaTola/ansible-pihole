---
- name: "Setup NTP package: {{ ntp.package }}"
  when: ntp.package == "ntp"
  become: true
  become_method: ansible.builtin.sudo
  block:
    - name: "Ensure NTP package is installed: {{ ntp.package }}"
      ansible.builtin.package:
        name: ntp
        state: present

    - name: "Configure {{ ntp.package }}"
      ansible.builtin.template:
        src: templates/ntp.conf.j2
        dest: /etc/ntp.conf
        owner: root
        group: root
        mode: '0644'
      notify: Restart {{ ntp.package }}

- name: "Setup NTP package: {{ ntp.package }}"
  when: ntp.package == "chrony"
  become: true
  become_method: ansible.builtin.sudo
  block:
    - name: "Ensure NTP package is installed: {{ ntp.package }}"
      ansible.builtin.package:
        name: "{{ ntp.package }}"
        state: present

    - name: "Configure {{ ntp.package }}"
      ansible.builtin.template:
        src: "templates/{{ ntp.package }}.conf.j2"
        dest: "/etc/{{ ntp.package }}/{{ ntp.package }}.conf"
        owner: root
        group: root
        mode: '0644'
      notify: Restart {{ ntp.package }}
