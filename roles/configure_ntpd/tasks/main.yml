---
- name: Validate ntp package setting
  ansible.builtin.assert:
    that:
      - ntp.package is defined
      - ntp.package in ['chrony', 'ntp']
    fail_msg: "NTP package must be either 'chrony' or 'ntp'."

- name: Validate ntp pool setting
  ansible.builtin.assert:
    that:
      - ntp.pool is defined
      - ntp.pool is match('^(?:[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?\.)*[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?$')
    fail_msg: "NTP pool value is invalid."

- name: "Setup NTP package: {{ ntp.package }}"
  when: ntp.package == "ntp"
  become: true
  become_method: ansible.builtin.sudo
  block:
    - name: "Ensure NTP package is installed: {{ ntp.package }}"
      ansible.builtin.package:
        name: ntp
        state: present

    - name: "Configure {{ ntp.package }}"
      ansible.builtin.template:
        src: templates/ntp.conf.j2
        dest: /etc/ntp.conf
        owner: root
        group: root
        mode: '0644'
      notify: Restart {{ ntp.package }}

- name: "Setup NTP package: {{ ntp.package }}"
  when: ntp.package == "chrony"
  become: true
  become_method: ansible.builtin.sudo
  block:
    - name: "Ensure NTP package is installed: {{ ntp.package }}"
      ansible.builtin.package:
        name: "{{ ntp.package }}"
        state: present

    - name: "Configure {{ ntp.package }}"
      ansible.builtin.template:
        src: "templates/{{ ntp.package }}.conf.j2"
        dest: "/etc/{{ ntp.package }}/{{ ntp.package }}.conf"
        owner: root
        group: root
        mode: '0644'
      notify: Restart {{ ntp.package }}
