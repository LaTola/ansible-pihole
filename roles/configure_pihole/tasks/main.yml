---

- name: Configure pi-hole
  become: true
  become_method: ansible.builtin.sudo
  notify: Restart pihole-FTL
  block:
    - name: Template /etc/hosts file
      ansible.builtin.template:
        src: "templates/hosts.j2"
        dest: "/etc/hosts"
        mode: "0644"

    - name: Ensure pihole-FTL service override directory exists
      ansible.builtin.file:
        path: "{{ systemd_unit_dir }}/pihole-FTL.service.d"
        state: directory
        mode: "0755"

    - name: Copy pihole-FTL service override configuration files
      ansible.builtin.template:
        src: "{{ item }}.j2"
        dest: "{{ systemd_unit_dir }}/pihole-FTL.service.d/{{ item | basename }}"
        mode: "0644"
      loop:
        - "templates/99-unbound-dependency.conf"

    - name: Copy pihole teleporter file
      ansible.builtin.copy:
        src: "files/{{ pihole_teleporter_filename }}"
        dest: "{{ pihole_teleporter_dest }}/{{ pihole_teleporter_filename }}"
        mode: "0644"

    - name: Import pihole teleporter file
      ansible.builtin.command:
        argv:
          - pihole-FTL
          - --teleporter
          - "{{ pihole_teleporter_dest }}/{{ pihole_teleporter_filename }}"
      register: pihole_import
      changed_when: pihole_import.rc != 0 

    - name: Update gravity DB
      become: true
      ansible.builtin.command:
        argv:
          - pihole
          - -g
      register: pihole_gravity_update
      async: 1200
      poll: 0

    - name: Wait for gravity DB update to complete
      ansible.builtin.async_status:
        jid: "{{ pihole_gravity_update.ansible_job_id }}"
      register: gravity_job_result
      until: gravity_job_result.finished
      retries: 40
      delay: 30
      changed_when: gravity_job_result.rc == 0

    - name: Remove pihole teleporter file
      ansible.builtin.file:
        path: "{{ pihole_teleporter_dest }}/{{ pihole_teleporter_filename }}"
        state: absent

    - name: Wait for gravity update to complete
      ansible.builtin.async_status:
        jid: "{{ pihole_gravity_update.ansible_job_id }}"
      register: pihole_gravity_update_status
      until: pihole_gravity_update_status.finished
      retries: 100
      delay: 10
