---

- name: Configure Cron Jobs
  become: true
  become_method: ansible.builtin.sudo
  block:
    - name: Ensure cron scripts root directory exists
      ansible.builtin.file:
        path: "{{ configure_cron_scripts_root }}"
        state: directory
        owner: root
        mode: "0750"

    - name: Install maintenance scripts
      ansible.builtin.template:
        src: "templates/optimize_FTL.sh.j2"
        dest: "{{ configure_cron_scripts_root }}/optimize_FTL.sh"
        owner: root
        group: root
        mode: "0750"

    - name: Deploy crontab from Jinja2 template
      ansible.builtin.template:
        src: templates/crontab.j2
        dest: /tmp/crontab
        owner: root
        group: root
        mode: "0644"

    - name: Install new crontab
      ansible.builtin.command:
        argv:
          - crontab
          - -u
          - root
          - /tmp/crontab
      changed_when: false

    - name: Remove temporary crontab file
      ansible.builtin.file:
        path: /tmp/crontab
        state: absent
