---

- name: Check if unit file exists for {{ service_name }}
  become: true
  become_method: ansible.builtin.sudo
  ansible.builtin.stat:
    path: "{{ systemd_unit_dir }}/{{ service_name }}.service"
  register: service_unit

- name: Reload systemd daemon
  become: true
  become_method: ansible.builtin.sudo
  ansible.builtin.systemd:
    daemon_reload: true
  when: service_daemon_reload | default(false)

- name: "{{ service_action | capitalize }} service {{ service_name }}"
  become: true
  become_method: ansible.builtin.sudo
  ansible.builtin.systemd:          # o service, según lo que necesites
    name: "{{ service_name }}"
    state: "{{ service_state }}"
    enabled: "{{ service_enabled | default(true) }}"
  when:
    - service_unit.stat.exists
    - service_name is defined
    - service_state is defined
    - service_action is defined
