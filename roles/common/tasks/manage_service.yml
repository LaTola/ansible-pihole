---
- name: "{{ service_action | capitalize }} service {{ service_name }}"
  become: true
  become_method: ansible.builtin.sudo
  ansible.builtin.service:
    name: "{{ service_name }}"
    state: "{{ service_state }}"
    enabled: "{{ service_enabled | default(true) }}"
    daemon_reload: "{{ service_daemon_reload | default(false) }}"
