---

- name: Configure unbound
  become: true
  become_method: ansible.builtin.sudo
  block:
    - name: Upload unbound.conf file
      ansible.builtin.template:
        src: unbound.conf.j2
        dest: "{{ unbound_config_dir }}/unbound.conf"
        owner: "{{ unbound_user }}"
        group: "{{ unbound_group }}"
        mode: "0644"

    - name: Download root.hints only if older than 30 days
      ansible.builtin.get_url:
        url: https://www.internic.net/domain/named.cache
        dest: "{{ unbound_config_dir }}/root.hints"
        checksum: sha256:https://www.internic.net/domain/named.cache.sha256
        owner: "{{ unbound_user }}"
        group: "{{ unbound_group }}"
        mode: '0644'

    - name: Upload unbound.conf.d configuration files
      ansible.builtin.template:
        src: "{{ item }}"
        dest: "{{ unbound_config_dir }}/unbound.conf.d/{{ item | basename | regex_replace('\\.j2$', '') }}"
        owner: "{{ unbound_user }}"
        group: "{{ unbound_group }}"
        mode: "0644"
      with_fileglob:
        - "templates/unbound.conf.d/*.conf.j2"

    - name: Upload systemd override configuration files
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "{{ systemd_unit_dir }}/unbound.service.d/{{ item | basename }}"
        owner: root
        group: root
        mode: "0644"
      with_fileglob:
        - "files/unbound.service.d/*.conf"

    - name: Add user unbound to group valkey
      ansible.builtin.user:
        name: unbound
        groups: valkey
        append: yes
