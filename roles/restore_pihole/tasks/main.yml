---
- name: Check if teleporter file exists
  ansible.builtin.stat:
    path: "{{ role_path }}/files/{{ pihole.teleporter.filename }}"
  register: restore_pihole_teleporter_file
  delegate_to: localhost
  become: false

- name: Restore pi-hole
  become: true
  become_method: ansible.builtin.sudo
  when: restore_pihole_teleporter_file.stat.isreg | default(false)
  block:
    - name: Template /etc/hosts file
      ansible.builtin.template:
        src: hosts.j2
        dest: /etc/hosts
        owner: root
        group: root
        mode: "0644"

    - name: Ensure pihole-FTL service override directory exists
      ansible.builtin.file:
        path: "{{ systemd.unit_dir }}/pihole-FTL.service.d"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Copy pihole-FTL service override configuration
      ansible.builtin.template:
        src: 99-unbound-dependency.conf.j2
        dest: "{{ systemd.unit_dir }}/pihole-FTL.service.d/99-unbound-dependency.conf"
        owner: root
        group: root
        mode: "0644"
      notify: Reload systemd daemon

    - name: Copy pihole teleporter file
      ansible.builtin.copy:
        src: "{{ role_path }}/files/{{ pihole.teleporter.filename }}"
        dest: "{{ pihole.teleporter.dest }}/{{ pihole.teleporter.filename }}"
        owner: root
        group: root
        mode: "0644"

    - name: Import pihole teleporter file
      ansible.builtin.command:
        argv:
          - pihole-FTL
          - --teleporter
          - "{{ pihole.teleporter.dest }}/{{ pihole.teleporter.filename }}"
      changed_when: true

    - name: Update gravity DB
      ansible.builtin.command:
        argv:
          - pihole
          - -g
      register: restore_pihole_gravity_update
      async: 1200
      poll: 0
      changed_when: true

    - name: Wait for gravity DB update to complete
      ansible.builtin.async_status:
        jid: "{{ restore_pihole_gravity_update.ansible_job_id }}"
      register: restore_pihole_gravity_job_result
      until: restore_pihole_gravity_job_result.finished | bool
      retries: 120
      delay: 10
      changed_when: false

  always:
    - name: Remove pihole teleporter file
      ansible.builtin.file:
        path: "{{ pihole.teleporter.dest }}/{{ pihole.teleporter.filename }}"
        state: absent

    - name: Clean up gravity async job metadata
      ansible.builtin.async_status:
        jid: "{{ restore_pihole_gravity_update.ansible_job_id }}"
        mode: cleanup
      when:
        - restore_pihole_gravity_update is defined
        - restore_pihole_gravity_update.ansible_job_id is defined
      changed_when: false
