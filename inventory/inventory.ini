[raspberrypi]
orangepi ansible_host=192.168.10.3 host_interface=end0

[raspberrypi:vars]

## LAN related variables
lan_network="192.168.10.0/24"

## NTP package name
ntp_package="chrony"    # It can be chrony or ntp depending on the system and preference
ntp_pool="south-america.pool.ntp.org"

## pi-hole configuration variables
pihole_teleporter_filename="pihole_teleporter.zip"
pihole_teleporter_vault="roles/configure_pihole/files"
pihole_teleporter_dest="/tmp"
pihole_default_webpassword="admin"
pihole_bin_dir="/usr/local/bin"

## Unbound configuration variables
unbound_config_dir="/etc/unbound"
unbound_daemon_config_dir="{{ unbound_config_dir }}/unbound.conf.d"
unbound_user="unbound"
unbound_group="unbound"
unbound_root_hints_dir="/usr/share/dns"

## Systemd variables
systemd_unit_dir="/etc/systemd/system"
